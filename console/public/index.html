<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMenu25 Console</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#111827;--mute:#6b7280;--line:#e5e7eb;--brand:#f97316;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--input:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--text:#f3f4f6;--mute:#9ca3af;--line:#26334a;--input:#0f1829}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;background:#111827;color:#fff}
  header b{color:var(--brand);font-size:18px} header .sp{flex:1}
  nav{display:flex;gap:4px} nav button{background:none;border:0;color:#d1d5db;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
  nav button.on{background:var(--brand);color:#fff}
  main{max-width:1250px;margin:0 auto;padding:20px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  input,select,textarea,button{font:inherit} input,select,textarea{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px}
  textarea{width:100%} .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:36px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)} .btn.red{background:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
  table{width:100%;border-collapse:collapse} th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em} tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer} tbody tr:hover{background:rgba(249,115,22,.07)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .allowed{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.blocked,.expired{background:#fee2e2;color:#991b1b}
  @media (prefers-color-scheme:dark){.allowed{background:#14532d;color:#bbf7d0}.pending{background:#78350f;color:#fde68a}.blocked,.expired{background:#7f1d1d;color:#fecaca}}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;margin-right:6px}.dot.on{background:var(--ok)}
  .mute{color:var(--mute)} .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(0,0,0,.55)} dialog form{padding:22px;display:grid;gap:12px}
  dialog h2{margin:0 0 4px;font-size:18px} label{display:grid;gap:4px;font-size:12px;color:var(--mute)} label input,label select{color:var(--text);font-size:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} .feat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
  .feat select{min-width:120px} .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px} .acts .sp{flex:1}
  #login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:12px}
  #err{color:var(--bad);min-height:18px} .hide{display:none!important} .tag{background:var(--line);border-radius:6px;padding:1px 6px;font-size:11px;margin-right:3px}
</style>
</head>
<body>
<div id="login" class="hide">
  <h2 style="margin:0">iMenu<span style="color:var(--brand)">25</span> Console</h2>
  <input id="u" placeholder="Username" autocomplete="username">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" id="go">Sign in</button>
</div>

<div id="app" class="hide">
  <header>
    <b>iMenu25</b><span>Console</span>
    <nav><button data-tab="devices" class="on">Devices</button><button data-tab="customers">Customers</button></nav>
    <span class="sp"></span><button class="btn ghost" id="out" style="color:#fff;border-color:#374151">Sign out</button>
  </header>
  <main>
    <section id="devices">
      <div class="bar"><input id="q" placeholder="Search S/N, ID, model, customer…" style="min-width:280px">
        <select id="fstat"><option value="">All statuses</option><option>pending</option><option>allowed</option><option>blocked</option></select>
        <select id="fcust"></select><span class="mute" id="dcount"></span></div>
      <div class="card"><table><thead><tr><th>Seen</th><th>S/N</th><th>Device ID</th><th>Model</th><th>Customer</th><th>Status</th><th>Licence until</th><th>App</th><th>Last IP</th></tr></thead><tbody id="dbody"></tbody></table></div>
    </section>
    <section id="customers" class="hide">
      <div class="bar"><button class="btn" id="newcust">+ New customer</button></div>
      <div class="card"><table><thead><tr><th>Name</th><th>Enrolment code</th><th>Devices</th><th>Licence until</th><th>Active</th><th>Features off</th></tr></thead><tbody id="cbody"></tbody></table></div>
    </section>
  </main>
</div>

<dialog id="ddlg"><form method="dialog" id="dform"></form></dialog>
<dialog id="cdlg"><form method="dialog" id="cform"></form></dialog>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('console.token') || '', devices = [], customers = [], FEATS = [];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(method, path, body) {
  const r = await fetch('/api/panel' + path, { method, headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { signOut(); throw new Error('Not signed in'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { alert(j.error || 'Error'); throw new Error(j.error); }
  return j;
}
function signOut() { token = ''; localStorage.removeItem('console.token'); show(); }
function show() { $('#login').classList.toggle('hide', !!token); $('#app').classList.toggle('hide', !token); if (token) load(); }

$('#go').onclick = async () => {
  $('#err').textContent = '';
  const r = await fetch('/api/panel/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('#u').value, password: $('#p').value }) });
  const j = await r.json();
  if (!r.ok) { $('#err').textContent = j.error || 'Failed'; return; }
  token = j.token; localStorage.setItem('console.token', token); show();
};
$('#p').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
$('#out').onclick = signOut;
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  ['devices', 'customers'].forEach((t) => $('#' + t).classList.toggle('hide', t !== b.dataset.tab));
});

async function load() {
  [FEATS, devices, customers] = await Promise.all([api('GET', '/features'), api('GET', '/devices'), api('GET', '/customers')]);
  const keep = $('#fcust').value;
  $('#fcust').innerHTML = '<option value="">All customers</option><option value="none">— unassigned —</option>' + customers.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#fcust').value = keep; drawDevices(); drawCustomers();
}
setInterval(() => { if (token && !document.querySelector('dialog[open]')) load().catch(() => {}); }, 30000);

const ago = (t) => { if (!t) return 'never'; const s = (Date.now() - new Date(t).getTime()) / 1000;
  return s < 90 ? 'now' : s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d'; };
const online = (t) => t && Date.now() - new Date(t).getTime() < 10 * 60 * 1000;

function drawDevices() {
  const q = $('#q').value.toLowerCase(), st = $('#fstat').value, cu = $('#fcust').value;
  const list = devices.filter((d) =>
    (!st || d.status === st) && (!cu || (cu === 'none' ? !d.customer_id : String(d.customer_id) === cu)) &&
    (!q || [d.serial, d.install_id, d.android_id, d.model, d.brand, d.label, d.customer_name].some((v) => (v || '').toLowerCase().includes(q))));
  $('#dcount').textContent = `${list.length} of ${devices.length} devices · ${devices.filter((d) => online(d.last_seen_at)).length} online`;
  $('#dbody').innerHTML = list.map((d) => `<tr data-id="${d.id}">
    <td><span class="dot ${online(d.last_seen_at) ? 'on' : ''}"></span>${ago(d.last_seen_at)}</td>
    <td>${d.serial ? `<b>${esc(d.serial)}</b>` : '<span class="mute">—</span>'}</td>
    <td class="mono">${esc(d.install_id.slice(0, 8))}${d.label ? ` <span class="mute">· ${esc(d.label)}</span>` : ''}</td>
    <td>${esc([d.brand, d.model].filter(Boolean).join(' ') || d.platform || '')}</td>
    <td>${d.customer_name ? esc(d.customer_name) : '<span class="mute">unassigned</span>'}</td>
    <td><span class="pill ${d.status}">${d.status}</span></td>
    <td>${d.licence_until || '<span class="mute">customer / none</span>'}</td>
    <td>${esc(d.app_version || '')}</td><td class="mono">${esc(d.last_ip || '')}</td></tr>`).join('') || '<tr><td colspan="9" class="mute" style="text-align:center;padding:30px">No devices yet. They appear here the first time an app starts.</td></tr>';
  document.querySelectorAll('#dbody tr[data-id]').forEach((tr) => tr.onclick = () => editDevice(+tr.dataset.id));
}
['q', 'fstat', 'fcust'].forEach((i) => $('#' + i).oninput = drawDevices);

function drawCustomers() {
  $('#cbody').innerHTML = customers.map((c) => {
    const off = Object.entries(c.features || {}).filter(([, v]) => v === false).map(([k]) => `<span class="tag">${esc(k)}</span>`).join('');
    return `<tr data-id="${c.id}"><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.code)}</td><td>${c.device_count}</td>
      <td>${c.licence_until || '<span class="mute">no expiry</span>'}</td><td><span class="pill ${c.is_active ? 'allowed' : 'blocked'}">${c.is_active ? 'active' : 'off'}</span></td><td>${off || '<span class="mute">—</span>'}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="mute" style="text-align:center;padding:30px">No customers yet.</td></tr>';
  document.querySelectorAll('#cbody tr[data-id]').forEach((tr) => tr.onclick = () => editCustomer(+tr.dataset.id));
}

/* tri-state selects: inherit / on / off */
const featRows = (cur, inheritLabel) => FEATS.map((f) => {
  const v = cur && typeof cur[f.key] === 'boolean' ? String(cur[f.key]) : '';
  return `<span>${esc(f.label)}</span><select data-f="${f.key}"><option value="" ${v === '' ? 'selected' : ''}>${inheritLabel}</option><option value="true" ${v === 'true' ? 'selected' : ''}>On</option><option value="false" ${v === 'false' ? 'selected' : ''}>Off</option></select>`;
}).join('');
const readFeats = (form) => { const o = {}; form.querySelectorAll('select[data-f]').forEach((s) => { if (s.value) o[s.dataset.f] = s.value === 'true'; }); return o; };

function editDevice(id) {
  const d = devices.find((x) => x.id === id), f = $('#dform');
  f.innerHTML = `<h2>${esc(d.serial || d.label || d.install_id.slice(0, 8))}</h2>
    <div class="mute mono">ID ${esc(d.install_id)}<br>Android ID ${esc(d.android_id || '—')} · ${esc([d.brand, d.model, d.os_version && 'Android ' + d.os_version].filter(Boolean).join(' · '))}<br>
      first seen ${esc(d.first_seen_at)} · last seen ${esc(d.last_seen_at || 'never')} · app ${esc(d.app_version || '?')}</div>
    <div class="row"><label>Serial number (S/N)<input name="serial" value="${esc(d.serial)}" placeholder="from the device label"></label>
      <label>Name / location<input name="label" value="${esc(d.label)}" placeholder="e.g. Bar tablet"></label></div>
    <div class="row"><label>Customer<select name="customerId"><option value="">— unassigned —</option>${customers.map((c) => `<option value="${c.id}" ${c.id === d.customer_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>Status<select name="status">${['allowed', 'pending', 'blocked'].map((s) => `<option ${s === d.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
    <label>Licence until (empty = use customer's date)<input type="date" name="licenceUntil" value="${d.licence_until || ''}"></label>
    <label>Notes<textarea name="notes" rows="2">${esc(d.notes)}</textarea></label>
    <div><div class="mute" style="margin-bottom:6px;font-size:12px">FEATURES — overrides this customer's settings</div><div class="feat">${featRows(d.features, 'Same as customer')}</div></div>
    <div class="acts"><button type="button" class="btn red" id="ddel">Remove</button><span class="sp"></span><button type="button" class="btn ghost" id="dcancel">Cancel</button><button type="button" class="btn" id="dsave">Save</button></div>`;
  $('#ddlg').showModal();
  $('#dcancel').onclick = () => $('#ddlg').close();
  $('#ddel').onclick = async () => { if (confirm('Remove this device from the list? It re-registers the next time the app starts.')) { await api('DELETE', '/devices/' + id); $('#ddlg').close(); load(); } };
  $('#dsave').onclick = async () => {
    await api('PATCH', '/devices/' + id, { serial: f.serial.value, label: f.label.value, customerId: f.customerId.value || null, status: f.status.value,
      licenceUntil: f.licenceUntil.value || null, notes: f.notes.value, features: readFeats(f) });
    $('#ddlg').close(); load();
  };
}

function editCustomer(id) {
  const c = id ? customers.find((x) => x.id === id) : { name: '', code: '', notes: '', is_active: 1, licence_until: '', features: {} }, f = $('#cform');
  f.innerHTML = `<h2>${id ? esc(c.name) : 'New customer'}</h2>
    <div class="row"><label>Name<input name="name" value="${esc(c.name)}"></label>
      <label>Enrolment code<input name="code" value="${esc(c.code)}" placeholder="auto if empty" style="text-transform:uppercase"></label></div>
    <div class="row"><label>Licence until (empty = no expiry)<input type="date" name="licenceUntil" value="${c.licence_until || ''}"></label>
      <label>Active<select name="isActive"><option value="1" ${c.is_active ? 'selected' : ''}>Active</option><option value="0" ${c.is_active ? '' : 'selected'}>Off (blocks all its devices)</option></select></label></div>
    <label>Notes<textarea name="notes" rows="2">${esc(c.notes)}</textarea></label>
    <div><div class="mute" style="margin-bottom:6px;font-size:12px">FEATURES for all this customer's devices</div><div class="feat">${featRows(c.features, 'On (default)')}</div></div>
    <div class="mute" style="font-size:12px">A new device joins this customer when its enrolment code is entered in the app (Server dialog), or you assign it in the Devices tab.</div>
    <div class="acts">${id ? '<button type="button" class="btn red" id="cdel">Delete</button>' : ''}<span class="sp"></span><button type="button" class="btn ghost" id="ccancel">Cancel</button><button type="button" class="btn" id="csave">Save</button></div>`;
  $('#cdlg').showModal();
  $('#ccancel').onclick = () => $('#cdlg').close();
  if (id) $('#cdel').onclick = async () => { if (confirm('Delete this customer? Its devices stay in the list, unassigned.')) { await api('DELETE', '/customers/' + id); $('#cdlg').close(); load(); } };
  $('#csave').onclick = async () => {
    const body = { name: f.name.value, code: f.code.value, licenceUntil: f.licenceUntil.value || null, notes: f.notes.value, features: readFeats(f) };
    if (id) await api('PATCH', '/customers/' + id, { ...body, isActive: f.isActive.value === '1' }); else await api('POST', '/customers', body);
    $('#cdlg').close(); load();
  };
}
$('#newcust').onclick = () => editCustomer(0);
show();
</script>
</body>
</html>
