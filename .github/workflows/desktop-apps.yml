name: Build desktop apps (Windows / Linux / macOS)

on:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Install desktop tooling
        working-directory: desktop
        run: npm install
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          VITE_CONSOLE_URL: ${{ vars.CONSOLE_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: iMenu25-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
