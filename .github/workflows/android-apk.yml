name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [cloud-modernization]
    paths: ['frontend/**', 'shared/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licences (the runner already has the SDK; Gradle fetches missing parts)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: Build web app and sync into the Android project
        working-directory: frontend
        env:
          VITE_CONSOLE_URL: ${{ vars.CONSOLE_URL }}
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iMenu25-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
